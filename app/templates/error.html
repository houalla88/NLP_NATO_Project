{% extends "base.html" %}
{% block title %}Prisme — {{ code }}{% endblock %}
{% block body %}
<style>
 :root{color-scheme:light dark}
 body{margin:0;font-family:Inter,ui-sans-serif,system-ui,sans-serif;
      display:grid;place-items:center;min-height:100vh;padding:20px}
 .card{max-width:34rem;border:1px solid #dde1e8;border-radius:.875rem;padding:28px}
 h1{margin:0 0 8px;font-size:2.2rem;color:#09806c}
 p{color:#525a6b;line-height:1.6}
 a{color:#09806c}
</style>
<div class="card">
  <h1>{{ code }}</h1>
  <p>{{ message }}</p>
  <p><a href="/">Retour a la liste des corpus</a></p>
</div>
{% endblock %}
